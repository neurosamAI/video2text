        weight = 2
      [[languages.ko.params.nav.items]]
        title = '동작 원리'
        url = '/ko/docs/how-it-works/'
        weight = 3
      [[languages.ko.params.nav.items]]
        title = '사용법'
        url = '/ko/docs/usage/'
        weight = 4
      [[languages.ko.params.nav.items]]
        title = '프라이버시 & 보안'
        url = '/ko/docs/privacy-security/'
        weight = 5
      [[languages.ko.params.nav.items]]
