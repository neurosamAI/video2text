<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>video2text</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <h1>video2text</h1>
  <p data-i18n="appSubtitle"></p>
</header>
<main>

  <section class="card" id="settingsCard">
    <h2 data-i18n="settingsTitle"></h2>

    <h3 class="subhead" data-i18n="settingsHfSubhead"></h3>
    <div id="settingsStatus" class="muted" data-i18n="settingsChecking"></div>
    <div id="settingsForm" class="row" style="margin-top:10px; display:none;">
      <input type="text" id="hfTokenInput" data-i18n-placeholder="hfTokenPlaceholder" />
      <button id="saveTokenBtn" data-i18n="btnSave"></button>
    </div>
    <p class="muted" style="margin-top:8px;" data-i18n-html="hfHelpHtml"></p>

    <h3 class="subhead" data-i18n="saveDirSubhead"></h3>
    <div class="row">
      <input type="text" id="saveDirInput" placeholder="~/Downloads/video2text" />
      <button id="saveDirBtn" data-i18n="btnSave"></button>
    </div>
    <p id="saveDirCurrent" class="muted" style="margin-top:8px;"></p>

    <h3 class="subhead" data-i18n="thresholdSubhead"></h3>
    <div class="row">
      <input type="range" id="thresholdInput" min="0.5" max="0.95" step="0.01" style="flex:1" />
      <span id="thresholdValue" class="muted" style="width:48px;text-align:right;"></span>
    </div>
    <p class="muted" style="margin-top:8px;" data-i18n="thresholdHelp"></p>

    <h3 class="subhead" data-i18n="consolidationSubhead"></h3>
    <div class="row">
      <input type="range" id="consolidationThresholdInput" min="0.5" max="0.95" step="0.01" style="flex:1" />
      <span id="consolidationThresholdValue" class="muted" style="width:48px;text-align:right;"></span>
    </div>
    <p class="muted" style="margin-top:8px;" data-i18n="consolidationHelp"></p>

    <h3 class="subhead" data-i18n="uiLanguageSubhead"></h3>
    <div class="row">
      <select id="uiLanguageSelect">
        <option value="system" data-i18n="uiLanguageSystem"></option>
        <option value="ko" data-i18n="uiLanguageKo"></option>
        <option value="en" data-i18n="uiLanguageEn"></option>
      </select>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="voiceProfileTitle"></h2>
    <p class="muted" data-i18n="voiceProfileHelp1"></p>
    <p class="muted" data-i18n-html="voiceProfileHelp2html"></p>
    <div id="profileList" class="profile-list"></div>
    <div class="row">
      <input type="text" id="profileName" data-i18n-placeholder="profileNamePlaceholder" />
      <label class="secondary" style="border:1px solid var(--border);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px;">
        <span data-i18n="uploadFileLabel"></span>
        <input type="file" id="profileFile" accept="audio/*,video/*" style="display:none" />
      </label>
    </div>
    <div class="script-box">
      <div class="muted" style="margin-bottom:6px;" data-i18n="scriptBoxLabel"></div>
      <p id="readScript"></p>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="convertTitle"></h2>
    <div class="dropzone" id="dropzone">
      <div id="dropzoneText" data-i18n="dropzoneDefault"></div>
      <input type="file" id="fileInput" accept="video/*,audio/*" />
    </div>
    <button id="pickNativeBtn" class="secondary" hidden style="margin-top:10px;" data-i18n="pickNativeBtn">
    </button>
    <div id="matchProfiles" class="profile-list" style="margin-top:14px;"></div>

    <div class="muted" style="margin-top:14px; font-size:13px;" data-i18n="expectedSpeakersLabel"></div>
    <p class="muted" style="margin:4px 0 0; font-size:12px;" data-i18n="expectedSpeakersHelp"></p>
    <div class="row" style="margin-top:6px; gap:8px; align-items:center;">
      <input type="number" id="minSpeakersInput" min="1" data-i18n-placeholder="minPlaceholder" style="width:80px;" />
      <span class="muted">~</span>
      <input type="number" id="maxSpeakersInput" min="1" data-i18n-placeholder="maxPlaceholder" style="width:80px;" />
    </div>

    <div class="row" style="margin-top:14px;">
      <button id="uploadBtn" disabled data-i18n="uploadBtn"></button>
      <span id="selectedFile" class="muted"></span>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="jobsTitle"></h2>
    <div id="jobs"></div>
    <div id="jobsPagination" style="display:flex; align-items:center; gap:12px; justify-content:center; margin-top:12px;"></div>
  </section>

</main>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
